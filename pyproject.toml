[project]
name = "clinical-trial-screening-demo"
version = "0.1.0"
description = "Portfolio public de pré-screening d'essais cliniques sur données synthétiques"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116,<1",
  "gradio>=5.49,<7",
  "httpx>=0.28,<1",
  "openai>=1.109,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "uvicorn[standard]>=0.35,<1",
  "pillow>=11.3,<13",
  "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
ocr = [
  "python-doctr>=1.1,<2",
]
dev = [
  "coverage[toml]>=7.10,<8",
  "pip-audit>=2.9,<3",
  "pyright>=1.1.405,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
clinical-screening = "clinical_screening.api.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_screening"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "clinical_screening/resources/config"
"demo_data" = "clinical_screening/resources/demo_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "ocr: tests chargeant les modèles docTR",
  "live: tests appelant un fournisseur externe",
  "docker: tests nécessitant Docker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["clinical_screening"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
