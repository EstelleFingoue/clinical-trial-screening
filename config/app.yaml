app:
  title: "Pré-screening d'essais cliniques — Démonstration synthétique"
  host: "0.0.0.0"
  port: 7860
  public_mode: true
  allow_custom_text: false

uploads:
  allowed_content_types: ["application/pdf"]
  max_files: 5
  min_document_types: 3
  max_pages_per_file: 5
  max_bytes_per_file: 10485760
  temp_root: null

ocr:
  backend: "doctr"
  detection_arch: "db_resnet50"
  recognition_arch: "crnn_vgg16_bn"
  pretrained: true
  max_concurrency: 1

inference:
  provider: "groq"
  timeout_seconds: 45
  max_retries: 2
  temperature: 0
  max_output_tokens: 3000
  cache_builtin_scenarios: true
  cache_uploaded_documents: false
  fallback_builtin_to_precomputed: true
  groq:
    base_url: "https://api.groq.com/openai/v1"
    model: "openai/gpt-oss-20b"
  ollama:
    base_url: "http://ollama:11434/v1"
    model: "qwen3:8b"

logging:
  level: "INFO"
  log_content: false
  log_filenames: false
